name: Verify fixture regeneration

# Temporary, verification only. Regenerates the ChainBehaviorParityTest golden fixture on a
# verify/fixture-* branch and checks the change. It never commits or pushes the result, reads no
# secrets, publishes nothing, and uploads the fixture only when every check passes.
on:
  push:
    branches:
      - 'verify/fixture-**'

permissions:
  contents: read

concurrency:
  group: verify-fixture-regen
  cancel-in-progress: false

jobs:
  regenerate:
    name: Regenerate and check parity fixture
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Guard branch scope
        shell: bash
        run: |
          set -euo pipefail
          case "$GITHUB_REF" in
            refs/heads/verify/fixture-*)
              echo "Fixture regeneration branch: $GITHUB_REF"
              ;;
            *)
              echo "This workflow runs only on verify/fixture-* branches (got $GITHUB_REF)." >&2
              exit 1
              ;;
          esac

      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Set up JDK 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
          # No dependency or build cache is configured.

      - name: Check Android SDK prerequisites
        shell: bash
        run: |
          set -euo pipefail
          echo "ANDROID_HOME=${ANDROID_HOME:-<unset>}"
          if [ -z "${ANDROID_HOME:-}" ]; then
            echo "ANDROID_HOME is not set. Stopping; this workflow installs nothing." >&2
            exit 1
          fi
          shopt -s nullglob
          platforms=("$ANDROID_HOME"/platforms/android-37*)
          if [ ${#platforms[@]} -eq 0 ]; then
            echo "No API 37 platform under $ANDROID_HOME/platforms. Stopping; this workflow installs nothing." >&2
            ls "$ANDROID_HOME/platforms" >&2 || true
            exit 1
          fi
          printf 'API 37 platforms found:\n'
          printf '  %s\n' "${platforms[@]}"

      - name: Regenerate parity fixture
        shell: bash
        run: |
          set -o pipefail
          chmod +x gradlew
          ./gradlew :app:testBaseDebugUnitTest --tests "*ChainBehaviorParityTest*" \
            -PupdateParityFixture=true --no-daemon --console=plain 2>&1 \
            | tee "$RUNNER_TEMP/regen.log"

      - name: Check regenerated fixture
        id: check
        shell: bash
        run: |
          set -uo pipefail
          FIXTURE="app/src/test/resources/chain-behavior-parity.txt"
          SUMMARY="${GITHUB_STEP_SUMMARY}"
          OUT="$GITHUB_WORKSPACE/regen-out"
          EXPECTED=24

          fail() {
            echo "Gate FAILED: $1" >&2
            {
              echo "### Gate: FAILED"
              echo
              echo "- Reason: $1"
            } >> "$SUMMARY"
            exit 1
          }

          # 1. Only the fixture may change among tracked files. Build outputs are git-ignored.
          CHANGED="$(git diff --name-only -- . | sort)"
          if [ -z "$CHANGED" ]; then
            fail "no tracked file changed; regeneration did not run or did not write the fixture"
          fi
          if [ "$CHANGED" != "$FIXTURE" ]; then
            fail "tracked files changed other than the fixture: $(echo "$CHANGED" | tr '\n' ' ')"
          fi

          # 2. The regeneration must have produced a real change.
          if git diff --quiet -- "$FIXTURE"; then
            fail "fixture is identical to the committed version; regeneration did not change it"
          fi

          # 3. Every changed content line must be an order= line. Diff headers start with "---"/"+++".
          NONORDER="$(git diff --unified=0 -- "$FIXTURE" | grep -E '^[-+][^-+]' | grep -v -E '^[-+]  order=[0-9]+$' || true)"
          if [ -n "$NONORDER" ]; then
            fail "changed lines other than order= values were found"
          fi

          # 4. Exactly 24 old and 24 new order= lines.
          REMOVED="$(git diff --unified=0 -- "$FIXTURE" | grep -c -E '^-  order=[0-9]+$' || true)"
          ADDED="$(git diff --unified=0 -- "$FIXTURE" | grep -c -E '^\+  order=[0-9]+$' || true)"
          if [ "$REMOVED" -ne "$EXPECTED" ] || [ "$ADDED" -ne "$EXPECTED" ]; then
            fail "expected $EXPECTED removed and $EXPECTED added order= lines, found $REMOVED removed and $ADDED added"
          fi

          # 5. The targeted test must have produced a JUnit result with no failures or errors.
          #    Gradle does not print passing test names by default, so the XML report is checked.
          XML="$(ls app/build/test-results/testBaseDebugUnitTest/TEST-*ChainBehaviorParityTest*.xml 2>/dev/null | head -n 1 || true)"
          if [ -z "$XML" ]; then
            fail "no JUnit result file for ChainBehaviorParityTest was found"
          fi
          if ! grep -q 'failures="0"' "$XML" || ! grep -q 'errors="0"' "$XML"; then
            fail "the JUnit result for ChainBehaviorParityTest reports failures or errors"
          fi
          if grep -q "BUILD FAILED" "$RUNNER_TEMP/regen.log"; then
            fail "the Gradle log reports BUILD FAILED"
          fi

          # All checks passed: stage the exact files for upload. Nothing is committed.
          mkdir -p "$OUT"
          cp "$FIXTURE" "$OUT/chain-behavior-parity.txt"
          git diff -- "$FIXTURE" > "$OUT/chain-behavior-parity.diff"
          SHA="$(sha256sum "$OUT/chain-behavior-parity.txt" | cut -d' ' -f1)"
          echo "sha256=$SHA" >> "$GITHUB_OUTPUT"
          {
            echo "### Gate: PASSED"
            echo
            echo "- Removed order= lines: $REMOVED"
            echo "- Added order= lines: $ADDED"
            echo "- Regenerated fixture SHA-256: \`$SHA\`"
            echo "- Nothing was committed or pushed."
          } >> "$SUMMARY"

      - name: Job summary with full diff
        if: always()
        shell: bash
        run: |
          set -uo pipefail
          FIXTURE="app/src/test/resources/chain-behavior-parity.txt"
          {
            echo "## Parity fixture regeneration (verification only)"
            echo
            echo "- Ref: \`$GITHUB_REF\`"
            echo "- Commit: \`$GITHUB_SHA\`"
            echo
            echo "### Complete fixture diff"
            echo
            echo '```diff'
            git diff -- "$FIXTURE" || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload fixture and diff
        if: steps.check.outcome == 'success'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: parity-fixture-regen
          path: |
            regen-out/chain-behavior-parity.txt
            regen-out/chain-behavior-parity.diff
          if-no-files-found: error
          retention-days: 1
