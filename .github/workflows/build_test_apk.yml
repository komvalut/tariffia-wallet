name: Build Test APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-test-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build base debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Configure Gradle for CI
        run: |
          mkdir -p "$HOME/.gradle"
          cat > "$HOME/.gradle/gradle.properties" <<'EOF'
          org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8
          kotlin.daemon.jvm.options=-Xmx2g
          org.gradle.parallel=true
          org.gradle.caching=true
          EOF

      - name: Check release branding
        run: python3 .github/scripts/check_release_branding.py

      - name: Make Gradle executable
        run: chmod +x gradlew

      - name: Build base debug APK
        run: ./gradlew :app:assembleBaseDebug --stacktrace --no-daemon --console=plain

      - name: Collect APK
        run: |
          set -euo pipefail
          APK="$(find app/build/outputs/apk/base/debug -maxdepth 1 -type f -name '*.apk' -print -quit)"
          if [ -z "$APK" ]; then
            echo "No debug APK found" >&2
            find app/build/outputs/apk -maxdepth 4 -type f -print || true
            exit 1
          fi
          cp "$APK" tariffia-wallet-debug.apk
          sha256sum tariffia-wallet-debug.apk | tee tariffia-wallet-debug.apk.sha256
          SIZE="$(du -h tariffia-wallet-debug.apk | cut -f1)"
          HASH="$(cut -d' ' -f1 tariffia-wallet-debug.apk.sha256)"
          {
            echo "## Tariffia test APK"
            echo
            echo "- Variant: \`baseDebug\`"
            echo "- Package: \`app.tariffia.wallet.dev\`"
            echo "- File: \`tariffia-wallet-debug.apk\`"
            echo "- SHA-256: \`$HASH\`"
            echo "- Size: $SIZE"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: tariffia-wallet-debug-apk
          path: |
            tariffia-wallet-debug.apk
            tariffia-wallet-debug.apk.sha256
          if-no-files-found: error
          retention-days: 30
