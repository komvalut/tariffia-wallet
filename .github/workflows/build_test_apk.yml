name: Build Test APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-test-apk-${{ github.ref }}
  cancel-in-progress: true

env:
  DEV_RELEASE_TAG: v1.0.0-dev
  DEV_APK_NAME: tariffia-wallet-v1.0.0-dev.apk

jobs:
  build:
    name: Build and publish base debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Configure Gradle for CI
        run: |
          mkdir -p "$HOME/.gradle"
          cat > "$HOME/.gradle/gradle.properties" <<'EOF'
          org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8
          kotlin.daemon.jvm.options=-Xmx2g
          org.gradle.parallel=true
          org.gradle.caching=true
          EOF

      - name: Check release branding
        run: python3 .github/scripts/check_release_branding.py

      - name: Make Gradle executable
        run: chmod +x gradlew

      - name: Build base debug APK
        run: ./gradlew :app:assembleBaseDebug --stacktrace --no-daemon --console=plain

      - name: Collect APK
        run: |
          set -euo pipefail
          APK="$(find app/build/outputs/apk/base/debug -maxdepth 1 -type f -name '*.apk' -print -quit)"
          if [ -z "$APK" ]; then
            echo "No debug APK found" >&2
            find app/build/outputs/apk -maxdepth 4 -type f -print || true
            exit 1
          fi
          cp "$APK" "$DEV_APK_NAME"
          sha256sum "$DEV_APK_NAME" | tee "$DEV_APK_NAME.sha256"
          SIZE="$(du -h "$DEV_APK_NAME" | cut -f1)"
          HASH="$(cut -d' ' -f1 "$DEV_APK_NAME.sha256")"
          DOWNLOAD_URL="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/download/$DEV_RELEASE_TAG/$DEV_APK_NAME"
          {
            echo "## Tariffia test APK"
            echo
            echo "- Variant: \`baseDebug\`"
            echo "- Package: \`app.tariffia.wallet.dev\`"
            echo "- File: \`$DEV_APK_NAME\`"
            echo "- SHA-256: \`$HASH\`"
            echo "- Size: $SIZE"
            echo "- Direct download: $DOWNLOAD_URL"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Publish public development release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.DEV_RELEASE_TAG }}
          name: Tariffia Wallet development build
          body: |
            Direct APK download:

            https://github.com/${{ github.repository }}/releases/download/${{ env.DEV_RELEASE_TAG }}/${{ env.DEV_APK_NAME }}

            - Package: `app.tariffia.wallet.dev`
            - Variant: `baseDebug`
            - Commit: `${{ github.sha }}`
            - Workflow run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

            This APK is signed with the public debug/test keystore and is for testing only.
          files: |
            ${{ env.DEV_APK_NAME }}
            ${{ env.DEV_APK_NAME }}.sha256
          fail_on_unmatched_files: true
          overwrite_files: true
          prerelease: true
          draft: false
