name: Verify unit tests

# Verification only. Runs on pushes to verify/* branches. It never runs for main, never
# publishes, uploads or releases anything, and reads no secrets.
on:
  push:
    branches:
      - 'verify/**'

permissions:
  contents: read

concurrency:
  group: verify-unit-tests
  cancel-in-progress: false

jobs:
  unit-tests:
    name: Compile and run unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Guard branch scope
        shell: bash
        run: |
          set -euo pipefail
          case "$GITHUB_REF" in
            refs/heads/verify/*)
              echo "Verification branch: $GITHUB_REF"
              ;;
            *)
              echo "This workflow runs only on verify/* branches (got $GITHUB_REF)." >&2
              exit 1
              ;;
          esac

      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Set up JDK 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
          # No dependency or build cache is configured, so nothing is saved or restored
          # and this job shares no Gradle state with any other workflow.

      - name: Check Android SDK prerequisites
        shell: bash
        run: |
          set -euo pipefail
          echo "ANDROID_HOME=${ANDROID_HOME:-<unset>}"
          if [ -z "${ANDROID_HOME:-}" ]; then
            echo "ANDROID_HOME is not set. Stopping; this workflow installs nothing." >&2
            exit 1
          fi
          shopt -s nullglob
          platforms=("$ANDROID_HOME"/platforms/android-37*)
          if [ ${#platforms[@]} -eq 0 ]; then
            echo "No API 37 platform under $ANDROID_HOME/platforms. Stopping; this workflow installs nothing." >&2
            ls "$ANDROID_HOME/platforms" >&2 || true
            exit 1
          fi
          printf 'API 37 platforms found:\n'
          printf '  %s\n' "${platforms[@]}"

      - name: Run unit tests
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew :walletkit:testDebugUnitTest :app:testBaseDebugUnitTest \
            --stacktrace --no-daemon --console=plain

      - name: Summarise test results
        if: always()
        shell: bash
        run: |
          python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import glob
          import os
          import xml.etree.ElementTree as ET

          print("## Unit test results (verification only)")
          print()
          print("- Ref: `" + os.environ.get("GITHUB_REF", "") + "`")
          print("- Commit: `" + os.environ.get("GITHUB_SHA", "") + "`")

          files = (
              glob.glob("walletkit/build/test-results/testDebugUnitTest/*.xml")
              + glob.glob("app/build/test-results/testBaseDebugUnitTest/*.xml")
          )
          tests = failures = errors = skipped = 0
          for path in files:
              root = ET.parse(path).getroot()
              suites = [root] if root.tag == "testsuite" else root.findall("testsuite")
              for suite in suites:
                  tests += int(suite.get("tests", 0))
                  failures += int(suite.get("failures", 0))
                  errors += int(suite.get("errors", 0))
                  skipped += int(suite.get("skipped", 0))

          print("- Result files read: " + str(len(files)))
          print("- Tests: " + str(tests) + ", failures: " + str(failures)
                + ", errors: " + str(errors) + ", skipped: " + str(skipped))
          PY
