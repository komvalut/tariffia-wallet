name: Build APK

on:
  push:
    # GitHub globs, not regex: no way to force leading-zero-free numbers here.
    # Strict vX.Y.Z validation happens in a dedicated step below.
    tags:
      - 'v*.*.*'
  # Manual signed TEST build. Runs only from main (guard below), verifies the signature and prints
  # the certificate fingerprint and APK SHA-256 in the log. It uploads nothing and never creates a
  # tag, a release or a versioned official build.
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    container:
      image: hsdao/android-release-build:java-17-update

    steps:
      # FIRST step: a manual run from any branch other than main stops here, before any
      # signing secret is read by any later step.
      - name: Guard manual builds to refs/heads/main
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        env:
          REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          if [[ "$REF" != "refs/heads/main" ]]; then
            echo "Manual signed test builds are allowed only from refs/heads/main (got $REF)"; exit 1
          fi

      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Fix git safe directory
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      # Strict filter for v1.0.0 and upward only. The tag is validated once
      # here and the result is trusted by every later step (including Gradle).
      - name: Validate tag
        if: github.event_name == 'push'
        shell: bash
        env:
          TAG: ${{ github.ref_name }}
        run: |
          [[ "$TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]] \
            || { echo "Tag '$TAG' is not a canonical vX.Y.Z"; exit 1; }

      # The tag goes through an environment variable, never straight into the
      # script, so a crafted tag name cannot run shell commands
      - name: Print validated tag
        if: github.event_name == 'push'
        shell: bash
        env:
          TAG: ${{ github.ref_name }}
        run: echo "Building $TAG"

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # The permanent keystore is restored only into the runner temp directory. Its path (never
      # its content or the password) is handed to later steps through GITHUB_ENV.
      - name: Restore release keystore
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          [[ -n "$KEYSTORE_BASE64" ]] || { echo "KEYSTORE_BASE64 secret is empty"; exit 1; }
          KS="${RUNNER_TEMP}/tariffia-release.p12"
          umask 077
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$KS"
          echo "TARIFFIA_KEYSTORE_FILE=$KS" >> "$GITHUB_ENV"

      # TARIFFIA_REQUIRE_SIGNING makes Gradle fail instead of emitting an unsigned release.
      # A manual build passes an empty TARIFFIA_TAG, so Gradle uses its existing fallback version.
      - name: Build signed Base Release
        env:
          TARIFFIA_TAG: ${{ github.event_name == 'push' && github.ref_name || '' }}
          TARIFFIA_REQUIRE_SIGNING: "true"
          TARIFFIA_KEY_ALIAS: tariffia-direct-release
          TARIFFIA_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          TARIFFIA_KEY_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: ./gradlew :app:assembleBaseRelease --stacktrace --no-daemon --console=plain

      # Exactly one APK must exist; anything else means end (no renames, no release), keeping the
      # rest of the job trivial to reason about.
      - name: Locate built APK
        shell: bash
        run: |
          mapfile -t APKs < <(find app/build/outputs/apk/base/release -name '*.apk')
          [[ ${#APKs[@]} -eq 1 ]] || {
            echo "Expected exactly 1 APK in base/release, found ${#APKs[@]}"; exit 1;
          }
          echo "APK=${APKs[0]}" >> "$GITHUB_ENV"

      # Fail closed: the APK must carry a valid v2 or v3 signature from exactly one signer whose
      # certificate SHA-256 equals the pinned Tariffia release key. Tag builds must also match the
      # tag's versionName; manual test builds print their version instead.
      - name: Verify release signature and version
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
          TAG: ${{ github.ref_name }}
          EXPECTED_CERT_SHA256: "F0:55:31:B8:15:6A:27:F9:86:48:A2:52:92:11:16:31:87:C7:CC:21:85:36:DC:B0:DF:26:26:C4:05:32:76:2A"
        run: |
          set -euo pipefail
          if ! VERIFY_OUT="$(apksigner verify --verbose --print-certs "$APK" 2>&1)"; then
            echo "apksigner verification FAILED"; exit 1
          fi
          grep -E '^Verified using v[23] scheme .*: true$' <<< "$VERIFY_OUT" >/dev/null \
            || { echo "APK has no valid v2/v3 signature"; exit 1; }
          SIGNERS="$(grep -cE '^Signer #[0-9]+ certificate SHA-256 digest:' <<< "$VERIFY_OUT" || true)"
          [[ "$SIGNERS" -eq 1 ]] || { echo "Expected exactly 1 signer, found $SIGNERS"; exit 1; }
          ACTUAL="$(sed -n 's/^Signer #1 certificate SHA-256 digest: //p' <<< "$VERIFY_OUT")"
          EXPECTED="${EXPECTED_CERT_SHA256//:/}"
          EXPECTED="${EXPECTED,,}"
          ACTUAL="${ACTUAL,,}"
          [[ "$ACTUAL" == "$EXPECTED" ]] || { echo "Signer certificate SHA-256 does not match the pinned release key"; exit 1; }
          echo "Signer certificate SHA-256 (verified): $ACTUAL"
          echo "Signature verified: one signer, certificate SHA-256 matches the pinned Tariffia release key."
          AAPT2_VERSION="${AAPT2_VERSION:-}"
          BUILD_TOOLS="$ANDROID_HOME/build-tools"
          if [[ -n "$AAPT2_VERSION" && -x "$BUILD_TOOLS/$AAPT2_VERSION/aapt2" ]]; then
            AAPT2="$BUILD_TOOLS/$AAPT2_VERSION/aapt2"
          else
            # If a future image ships several Build Tools versions, sort their
            # directory names with version-aware sorting (handles 33.0.1 vs
            # 10.0.0-style comparisons that a lexical sort gets wrong) and take
            # the highest deterministically. If versions are equal, the last
            # sorted line wins — the same candidate either way.
            AAPT2="$(
              find "$BUILD_TOOLS" -mindepth 2 -maxdepth 2 -name aapt2 |
                while IFS= read -r a; do
                  printf '%s %s\n' "$(basename "$(dirname "$a")")" "$a"
                done |
                sort -V |
                tail -n 1 |
                cut -d ' ' -f2-
            )"
          fi
          [[ -n "$AAPT2" && -x "$AAPT2" ]] || { echo "aapt2 not found in container"; exit 1; }
          BADGING="$("$AAPT2" dump badging "$APK")"
          grep -E '^package:' <<< "$BADGING"
          if [[ "$EVENT" == "push" ]]; then
            # Git tags are vX.Y.Z but the manifest versionName is X.Y.Z (the
            # leading "v" is stripped in Gradle), so the check strips it here too
            VERSION="${TAG#v}"
            grep -F "versionName='${VERSION}'" <<< "$BADGING" >/dev/null \
              || { echo "versionName mismatch"; exit 1; }
          else
            echo "Manual test build: versionName is not checked against a tag."
          fi

      # Tag builds keep the existing release file name; manual builds get a test name bound to
      # the commit. Both paths print the SHA-256 of the exact file. A manual test APK stays on the
      # runner and is not uploaded or published anywhere.
      - name: Rename APK and print its SHA-256
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [[ "$EVENT" == "push" ]]; then
            OUT="tariffia-wallet-${TAG}.apk"
          else
            OUT="tariffia-wallet-test-${GITHUB_SHA:0:7}.apk"
          fi
          cp "$APK" "$OUT"
          echo "Output APK: $OUT"
          sha256sum "$OUT"

      - name: Create draft GitHub Release
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          draft: true
          prerelease: false
          make_latest: false
          files: |
            tariffia-wallet-*.apk

      # Runs even when an earlier step fails: the plaintext keystore must never outlive the job.
      - name: Remove plaintext release keystore
        if: always()
        shell: bash
        run: |
          rm -f -- "${RUNNER_TEMP}/tariffia-release.p12"
